name: Feature request
description: Suggest something the tool should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The reorganisation you are attempting, and where the tool gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: >
        If it involves the listing format, an example of what you would write
        and what you would expect it to do is the most useful thing you can
        include.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Other commands, other tools, or a manual workaround.
    validations:
      required: false
